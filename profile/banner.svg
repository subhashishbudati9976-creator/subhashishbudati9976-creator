<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Midnight background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="55%" stop-color="#0A1024"/>
      <stop offset="100%" stop-color="#120A24"/>
    </linearGradient>

    <!-- Aurora -->
    <radialGradient id="auroraBlue">
      <stop offset="0%" stop-color="#4F9DFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F9DFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPurple">
      <stop offset="0%" stop-color="#9B6CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9B6CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Glass -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">

      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#7AA2F7"
            stroke-opacity="0.055"
            stroke-width="1"/>

    </pattern>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1200" height="420"
        rx="24"
        fill="url(#bg)"/>


  <!-- ================= AURORA ================= -->

  <ellipse cx="250" cy="40"
           rx="430"
           ry="210"
           fill="url(#auroraBlue)"
           opacity="0.65">

    <animate attributeName="opacity"
             values="0.45;0.75;0.45"
             dur="7s"
             repeatCount="indefinite"/>

  </ellipse>


  <ellipse cx="950" cy="360"
           rx="430"
           ry="220"
           fill="url(#auroraPurple)"
           opacity="0.55">

    <animate attributeName="opacity"
             values="0.35;0.65;0.35"
             dur="9s"
             repeatCount="indefinite"/>

  </ellipse>


  <!-- ================= GRID ================= -->

  <rect x="20"
        y="20"
        width="1160"
        height="380"
        rx="18"
        fill="url(#grid)"/>


  <!-- ================= BORDER ================= -->

  <rect x="20"
        y="20"
        width="1160"
        height="380"
        rx="18"
        fill="none"
        stroke="#7AA2F7"
        stroke-opacity="0.22"/>


  <!-- ================= CORNER BRACKETS ================= -->

  <g fill="none"
     stroke-width="2">

    <path d="M55 105 V55 H105"
          stroke="#7AA2F7"
          stroke-opacity="0.7">

      <animate attributeName="stroke-opacity"
               values="0.35;0.9;0.35"
               dur="4s"
               repeatCount="indefinite"/>

    </path>


    <path d="M1095 55 H1145 V105"
          stroke="#9B6CFF"
          stroke-opacity="0.7">

      <animate attributeName="stroke-opacity"
               values="0.35;0.9;0.35"
               dur="5s"
               repeatCount="indefinite"/>

    </path>


    <path d="M55 315 V365 H105"
          stroke="#9B6CFF"
          stroke-opacity="0.7">

      <animate attributeName="stroke-opacity"
               values="0.35;0.9;0.35"
               dur="4.5s"
               repeatCount="indefinite"/>

    </path>


    <path d="M1095 365 H1145 V315"
          stroke="#7AA2F7"
          stroke-opacity="0.7">

      <animate attributeName="stroke-opacity"
               values="0.35;0.9;0.35"
               dur="5.5s"
               repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ================= ORBIT SYSTEM ================= -->

  <g transform="translate(600 175)">

    <!-- outer orbit -->

    <ellipse rx="285"
             ry="92"
             fill="none"
             stroke="#7AA2F7"
             stroke-opacity="0.16"
             stroke-width="2">

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0;360"
        dur="28s"
        repeatCount="indefinite"/>

    </ellipse>


    <!-- inner orbit -->

    <ellipse rx="230"
             ry="72"
             fill="none"
             stroke="#9B6CFF"
             stroke-opacity="0.14"
             stroke-width="1">

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="360;0"
        dur="20s"
        repeatCount="indefinite"/>

    </ellipse>

  </g>


  <!-- ================= ORBIT NODES ================= -->

  <circle cx="315"
          cy="175"
          r="4"
          fill="#7AA2F7">

    <animate attributeName="r"
             values="3;5;3"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="885"
          cy="175"
          r="4"
          fill="#9B6CFF">

    <animate attributeName="r"
             values="3;5;3"
             dur="3.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="3.5s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="600"
          cy="83"
          r="3"
          fill="#7AA2F7">

    <animate attributeName="opacity"
             values="0.2;1;0.2"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================= TERMINAL STATUS ================= -->

  <text x="75"
      y="88"
      font-family="monospace"
      font-size="13"
      fill="#7AA2F7">

    PROFILE.SYSTEM // <tspan fill="#39FF88">ONLINE</tspan>

    <animate attributeName="opacity"
             values="0.45;1;0.45"
             dur="3s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================= MAIN NAME ================= -->

  <text x="600"
        y="165"
        text-anchor="middle"
        font-family="monospace"
        font-size="58"
        font-weight="700"
        letter-spacing="7"
        fill="#FFFFFF"
        filter="url(#glow)">

    SUBHASHISH

    <animate attributeName="opacity"
             values="0.88;1;0.88"
             dur="4s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================= NAME ACCENT ================= -->

  <line x1="455"
        y1="190"
        x2="745"
        y2="190"
        stroke="#7AA2F7"
        stroke-width="2">

    <animate attributeName="x1"
             values="455;480;455"
             dur="5s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="745;720;745"
             dur="5s"
             repeatCount="indefinite"/>

  </line>


  <!-- ================= IDENTITY ================= -->

  <text x="600"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="16"
        letter-spacing="3"
        fill="#AFC7FF">

    CSE  •  AI  •  NLP  •  DEVOPS

    <animate attributeName="opacity"
             values="0.65;1;0.65"
             dur="5s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================= STAT PANELS ================= -->

  <rect x="280"
        y="270"
        width="250"
        height="70"
        rx="12"
        fill="url(#panel)"
        stroke="#7AA2F7"
        stroke-opacity="0.18"/>


  <rect x="670"
        y="270"
        width="250"
        height="70"
        rx="12"
        fill="url(#panel)"
        stroke="#9B6CFF"
        stroke-opacity="0.18"/>


  <!-- ================= STAT TEXT ================= -->

  <text x="405"
        y="296"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#7AA2F7">

    PROFILE

  </text>


  <text x="405"
        y="321"
        text-anchor="middle"
        font-family="monospace"
        font-size="15"
        fill="#FFFFFF">

    VIEWS

  </text>


  <text x="795"
        y="296"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#9B6CFF">

    GITHUB

  </text>


  <text x="795"
        y="321"
        text-anchor="middle"
        font-family="monospace"
        font-size="15"
        fill="#FFFFFF">

    CONTRIBUTOR

  </text>


  <!-- ================= FOOTER STATUS ================= -->

  <text x="600"
        y="380"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        letter-spacing="3"
        fill="#7AA2F7">

    BUILDING  •  LEARNING  •  DEPLOYING  •  IMPROVING

    <animate attributeName="opacity"
             values="0.35;0.8;0.35"
             dur="6s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================= PARTICLES ================= -->

  <g fill="#FFFFFF">

    <circle cx="170" cy="130" r="1.5">

      <animate attributeName="opacity"
               values="0.15;0.9;0.15"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="210" cy="285" r="1">

      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="4s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="1020" cy="125" r="1.5">

      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="3.5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="980" cy="285" r="1">

      <animate attributeName="opacity"
               values="0.1;0.8;0.1"
               dur="5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="145" cy="240" r="1">

      <animate attributeName="opacity"
               values="0.15;0.7;0.15"
               dur="4.5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="1055" cy="225" r="1.5">

      <animate attributeName="opacity"
               values="0.1;0.9;0.1"
               dur="3.8s"
               repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
