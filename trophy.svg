<svg xmlns="http://www.w3.org/2000/svg"
width="1100"
height="460"
viewBox="0 0 1100 460">

<defs>

    <linearGradient id="background"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#020617"/>
        <stop offset="100%" stop-color="#172554"/>

    </linearGradient>

    <linearGradient id="trophy"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#e2e8f0"/>
        <stop offset="50%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>

    </linearGradient>

    <filter id="shadow">

        <feDropShadow
            dx="0"
            dy="10"
            stdDeviation="12"
            flood-opacity="0.4"/>

    </filter>

</defs>


<!-- Background -->

<rect
    width="1100"
    height="460"
    rx="30"
    fill="url(#background)"/>


<!-- LEFT SECTION : TROPHY -->

<g filter="url(#shadow)">

    <!-- Left handle -->

    <path
        d="M190 100
           C120 85, 90 120, 110 165
           C125 200, 155 205, 190 180"
        fill="none"
        stroke="url(#trophy)"
        stroke-width="18"
        stroke-linecap="round"/>


    <!-- Right handle -->

    <path
        d="M410 100
           C480 85, 510 120, 490 165
           C475 200, 445 205, 410 180"
        fill="none"
        stroke="url(#trophy)"
        stroke-width="18"
        stroke-linecap="round"/>


    <!-- Cup -->

    <path
        d="M180 80
           L420 80
           L395 180
           C385 220, 350 245, 300 245
           C250 245, 215 220, 205 180
           Z"
        fill="url(#trophy)"/>


    <!-- Star -->

    <path
        d="M300 105
           L315 140
           L352 142
           L323 164
           L333 200
           L300 178
           L267 200
           L277 164
           L248 142
           L285 140
           Z"
        fill="#fff7ed"/>


    <!-- Stem -->

    <rect
        x="280"
        y="240"
        width="40"
        height="50"
        rx="7"
        fill="url(#trophy)"/>


    <!-- Base -->

    <rect
        x="230"
        y="285"
        width="140"
        height="25"
        rx="8"
        fill="url(#trophy)"/>

</g>


<!-- Divider -->

<line
    x1="550"
    y1="55"
    x2="550"
    y2="405"
    stroke="#334155"
    stroke-width="2"/>


<!-- RIGHT SECTION -->

<text
    x="825"
    y="80"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Arial, Helvetica, sans-serif"
