<svg xmlns="http://www.w3.org/2000/svg"
width="1000"
height="420"
viewBox="0 0 1000 420">

<defs>

    <linearGradient id="background"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#020617"/>
        <stop offset="100%" stop-color="#172554"/>

    </linearGradient>

    <linearGradient id="gold"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#facc15"/>
        <stop offset="100%" stop-color="#a16207"/>

    </linearGradient>

    <filter id="shadow">

        <feDropShadow
            dx="0"
            dy="10"
            stdDeviation="12"
            flood-opacity="0.4"/>

    </filter>

</defs>


<!-- Background -->

<rect
    width="1000"
    height="420"
    rx="30"
    fill="url(#background)"/>


<!-- Trophy -->

<g filter="url(#shadow)">

    <!-- Left handle -->

    <path
        d="M280 85
           C200 70, 165 110, 190 165
           C210 205, 250 205, 280 175"

        fill="none"
        stroke="url(#gold)"
        stroke-width="18"
        stroke-linecap="round"/>


    <!-- Right handle -->

    <path
        d="M520 85
           C600 70, 635 110, 610 165
           C590 205, 550 205, 520 175"

        fill="none"
        stroke="url(#gold)"
        stroke-width="18"
        stroke-linecap="round"/>


    <!-- Cup -->

    <path
        d="M270 70
           L530 70
           L500 180
           C490 220, 455 245, 400 245
           C345 245, 310 220, 300 180
           Z"

        fill="url(#gold)"/>


    <!-- Star -->

    <path
        d="M400 95
           L415 130
           L452 132
           L423 154
           L433 190
           L400 168
           L367 190
           L377 154
           L348 132
           L385 130
           Z"

        fill="#fff7ed"/>


    <!-- Stem -->

    <rect
        x="380"
        y="240"
        width="40"
        height="50"
        rx="7"
        fill="url(#gold)"/>


    <!-- Base -->

    <rect
        x="330"
        y="285"
        width="140"
        height="25"
        rx="8"
        fill="url(#gold)"/>

</g>


<!-- Title -->

<text
    x="700"
    y="105"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700">

    GITHUB TROPHY

</text>


<!-- Username -->

<text
    x="700"
    y="145"
    text-anchor="middle"
    fill="#cbd5e1"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20">

    @subhashishbudati9976-creator

</text>


<!-- Level -->

<text
    x="700"
    y="190"
    text-anchor="middle"
    fill="#facc15"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="700">

    BUILDER

</text>


<!-- Stats -->

<text
    x="700"
    y="240"
    text-anchor="middle"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18">

    Repositories: 9

</text>


<text
    x="700"
    y="275"
    text-anchor="middle"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18">

    Followers: 9

</text>


<text
    x="700"
    y="310"
    text-anchor="middle"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18">

    Following: 9

</text>


<!-- Updated -->

<text
    x="500"
    y="375"
    text-anchor="middle"
    fill="#64748b"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14">

    Automatically updated • 2026-08-17

</text>

</svg>
