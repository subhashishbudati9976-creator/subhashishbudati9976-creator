<svg xmlns="http://www.w3.org/2000/svg"
width="1100"
height="460"
viewBox="0 0 1100 460">

<defs>

    <linearGradient id="background"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#020617"/>
        <stop offset="100%" stop-color="#172554"/>

    </linearGradient>

    <linearGradient id="trophy"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#e2e8f0"/>
        <stop offset="50%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>

    </linearGradient>

    <filter id="shadow">

        <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="14"
            flood-opacity="0.45"/>

    </filter>

</defs>


<!-- Background -->

<rect
    width="1100"
    height="460"
    rx="30"
    fill="url(#background)"/>


<!-- ================= TROPHY AREA ================= -->

<g filter="url(#shadow)">

    <!-- Left handle -->

    <path
        d="M190 105
           C105 85, 75 130, 105 180
           C125 215, 160 215, 195 185"
        fill="none"
        stroke="url(#trophy)"
        stroke-width="22"
        stroke-linecap="round"/>


    <!-- Right handle -->

    <path
        d="M410 105
           C495 85, 525 130, 495 180
           C475 215, 440 215, 405 185"
        fill="none"
        stroke="url(#trophy)"
        stroke-width="22"
        stroke-linecap="round"/>


    <!-- Cup -->

    <path
        d="M175 75
           L425 75
           L395 190
           C385 235, 350 260, 300 260
           C250 260, 215 235, 205 190
           Z"
        fill="url(#trophy)"/>


    <!-- Star -->

    <path
        d="M300 105
           L318 145
           L360 148
           L327 173
           L338 215
           L300 190
           L262 215
           L273 173
           L240 148
           L282 145
           Z"
        fill="#fff7ed"/>


    <!-- Stem -->

    <rect
        x="280"
        y="255"
        width="40"
        height="55"
        rx="8"
        fill="url(#trophy)"/>


    <!-- Base -->

    <rect
        x="220"
        y="305"
        width="160"
        height="28"
        rx="9"
        fill="url(#trophy)"/>

</g>


<!-- Trophy label -->

<text
    x="300"
    y="370"
    text-anchor="middle"
    fill="#cbd5e1"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="600">

    YOUR GITHUB TROPHY

</text>


<!-- ================= DIVIDER ================= -->

<line
